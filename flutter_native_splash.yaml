flutter_native_splash:
  android: true
  ios: true
  web: false

  # iPhone + Android 11 and older
  background_image: "assets/branding/welcome_bg_light.png"
  background_image_dark: "assets/branding/welcome_bg_dark.png"

  image: "assets/branding/arcticdose_brandmark_light.png"
  image_dark: "assets/branding/arcticdose_brandmark_dark.png"

  android_gravity: center
  ios_content_mode: center

  # Android 12+
  android_12:
    color: "#DCE7FF"
    color_dark: "#07101F"

    image: "assets/branding/arcticdose_splash_mark.png"
    image_dark: "assets/branding/arcticdose_splash_mark.png"