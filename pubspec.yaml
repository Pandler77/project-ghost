name: project_ghost

description: "MODOSE - Protocol & Medication Tracker"

publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.15
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.5
  scrollable_positioned_list: ^0.3.8
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  path_provider: ^2.1.6
  flex_color_picker: ^3.8.0
  flutter_native_splash: ^2.4.8
  aptabase_flutter: ^0.5.0
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  purchases_flutter: ^10.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true

  image_path: "assets/branding/modose_icon.png"

  adaptive_icon_background: "#07101F"
  adaptive_icon_foreground: "assets/branding/modose_icon.png"

  min_sdk_android: 21
  remove_alpha_ios: true
